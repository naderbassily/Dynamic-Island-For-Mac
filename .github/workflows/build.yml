name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build app
        run: ./build.sh --zip
      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: DynamicIsland
          path: build/DynamicIsland.zip
